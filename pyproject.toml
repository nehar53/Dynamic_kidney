[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dkex"
version = "0.1.0"
description = "Dynamic kidney exchange: fairness-aware NSGA-III with adaptive operator selection and PoF trajectories (ANZKX-calibrated simulator)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "matplotlib>=3.8", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dkex = "dkex.cli:main"

[tool.setuptools.packages.find]
include = ["dkex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
